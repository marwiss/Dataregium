name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # The optional ifc-db extra is installed so the type checker sees the real ifcopenshell module.
      - run: uv sync --extra ifc-db
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check opencde client/opencde_client

  test:
    name: Tests (Python ${{ matrix.python }}${{ matrix.extras && ', IFC-DB' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
        extras: [""]
        include:
          # The tests of the IFC code itself (the copy of Dataspatium's change sets, the diff, the rooms, the
          # clash check) need IfcOpenShell, which the server without the extra does without.
          - python: "3.13"
            extras: "--extra ifc-db"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync $EXTRAS
        env:
          EXTRAS: ${{ matrix.extras }}
      - run: uv run pytest -m "not integration and not e2e and not ui"

  postgres:
    name: Tiers 1 and 2 (PostgreSQL without a graph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra ifc-db
      # Every API test of both stores in its PostgreSQL variant, with the graph's address on a port where nothing
      # listens (F69 b), and the tests of PostgreSQL itself; the graph job below runs the rest.
      - run: uv run pytest -q -m "integration or e2e" -k postgres

  integration:
    name: Tier 3 (the graph, Neo4j in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra ifc-db
      # buildingSMART's ifc-gherkin-rules in an environment of their own, as the image has them (ADR 0012).
      - run: uv run python -m ifc_db.gherkin_install "$RUNNER_TEMP/gherkin"
      - run: uv run pytest -q -m "integration or e2e" -k "not postgres"
        env:
          OPENCDE_TEST_GHERKIN_ENV: ${{ runner.temp }}/gherkin
      # IfcOpenShell's EXPRESS rules import pytest at run time. The image has it from the extra alone, without the dev group.
      - run: uv run --no-dev --extra ifc-db python -m ifc_db.validation tests/fixtures/three_walls_gtin.ifc

  ifcmerge:
    # ifcmerge (GPL-3.0-or-later) as the image runs it, at the commit the image pins and at PR #25 (F97 c), fetched
    # and checked against its SHA-256 here, never kept in this repository (ADR 0030).
    name: ifcmerge (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pinned main
            commit: bd2e277f3bd353ba5b7bc450c91fc092f7d13950
            sha256: 5eb34fa35dd4033b1313496d1672376dcf1cedd8d716831daf2f95f5e5761c95
          - name: PR 25
            commit: 387831ed8114b4575f7adce917fce23de2138226
            sha256: e39317424f04e499a3c019fecec50d77f54644b592ed4a8f1041a09db08fbaa5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdatetime-perl libdatetime-timezone-perl
      - run: |
          curl -sSfL -o "$RUNNER_TEMP/ifcmerge" "https://raw.githubusercontent.com/brunopostle/ifcmerge/$COMMIT/ifcmerge"
          echo "$SHA256  $RUNNER_TEMP/ifcmerge" | sha256sum -c -
        env:
          COMMIT: ${{ matrix.commit }}
          SHA256: ${{ matrix.sha256 }}
      - run: uv sync --extra ifc-db
      - run: uv run pytest -q tests/unit/test_ifcmerge.py
        env:
          OPENCDE_TEST_IFCMERGE: ${{ runner.temp }}/ifcmerge

  ui:
    name: Browser tests (Playwright, axe-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --group ui
      - run: uv run playwright install --with-deps chromium firefox
      - run: uv run pytest -q -m ui

  security:
    name: Static security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - name: Bandit
        run: uv run bandit -q -r opencde client/opencde_client -c pyproject.toml
      - name: pip-audit (known vulnerabilities in locked dependencies)
        run: uv run pip-audit --skip-editable
      - name: pip-audit (the environment of buildingSMART's rules, from the requirements in IFC-DB)
        run: uv run poe audit-gherkin
      - name: gitleaks (secrets in the repository)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: zizmor (GitHub Actions hardening)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config p/python --config p/owasp-top-ten --config p/secrets --exclude spec --error
