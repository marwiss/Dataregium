# Local development overlay: the API on http://127.0.0.1:8000 and the databases
# reachable from the host, so that `uv run opencde ...` and psql reach PostgreSQL on
# 127.0.0.1:5442 and, in tier 3 (COMPOSE_PROFILES=graph), Neo4j Browser and
# Dataspatium reach the graph on http://127.0.0.1:7484 and Bolt on 127.0.0.1:7697.
# The host ports avoid the defaults (5432, 7474/7687) because another PostgreSQL or
# Neo4j on the same machine often holds them; override with OPENCDE_DEV_* in .env.
# Everything binds to 127.0.0.1 only. A second checkout on the same machine
# needs its own COMPOSE_PROJECT_NAME and OPENCDE_DEV_* ports in .env, because
# compose.yaml names the project "dataregium" and the two would share containers.

services:
  store:
    ports:
      - "127.0.0.1:${OPENCDE_DEV_POSTGRES_PORT:-5442}:5432"

  graph:
    profiles: ["graph"]  # as in compose.yaml: these ports only come with the graph
    ports:
      - "127.0.0.1:${OPENCDE_DEV_NEO4J_HTTP_PORT:-7484}:7474"
      - "127.0.0.1:${OPENCDE_DEV_NEO4J_BOLT_PORT:-7697}:7687"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    pull_policy: build
    ports:
      - "127.0.0.1:${OPENCDE_DEV_PORT:-8000}:8000"
    environment:
      OPENCDE_ENVIRONMENT: development
      OPENCDE_PUBLIC_URL: "http://127.0.0.1:${OPENCDE_DEV_PORT:-8000}"
      OPENCDE_LOG_JSON: "false"
      OPENCDE_LOG_LEVEL: DEBUG
